<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Task Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container"><h1>Mini Task Manager</h1><p>Bài kiểm tra thực hành HTML, CSS, JavaScript</p></div>
  </header>

  <main class="container">
    <!-- A: Form thêm công việc -->
    <section class="add-panel" aria-labelledby="form-title">
      <h2 id="form-title">Thêm công việc mới</h2>
      <form id="task-form" novalidate>
        <div class="form-grid">
          <div class="field field-title">
            <label for="task-title">Tên công việc <span class="required" aria-hidden="true">*</span></label>
            <input type="text" id="task-title" name="title" placeholder="Ví dụ: Nộp bài tập Web" autocomplete="off" aria-describedby="form-error">
          </div>
          <div class="field">
            <label for="task-due">Hạn hoàn thành</label>
            <input type="date" id="task-due" name="dueDate">
          </div>
          <div class="field">
            <label for="task-priority">Mức ưu tiên</label>
            <select id="task-priority" name="priority">
              <option value="Cao">Cao</option>
              <option value="Trung bình" selected>Trung bình</option>
              <option value="Thấp">Thấp</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary">Thêm</button>
        </div>
        <p id="form-error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <!-- A: Tìm kiếm, lọc trạng thái, danh sách -->
    <section class="list-panel" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">Danh sách công việc</h2>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </div>

      <div class="toolbar">
        <div class="field">
          <label for="search-input">Tìm kiếm theo tên</label>
          <input type="search" id="search-input" placeholder="Nhập tên công việc..." autocomplete="off">
        </div>
        <div class="field">
          <label for="status-filter">Trạng thái</label>
          <select id="status-filter">
            <option value="all">Tất cả</option>
            <option value="pending">Chưa hoàn thành</option>
            <option value="done">Đã hoàn thành</option>
          </select>
        </div>
      </div>

      <ul id="task-list" class="task-list"></ul>
      <p id="empty-message" class="empty" hidden>Không có công việc nào phù hợp. Thử đổi từ khóa hoặc bộ lọc.</p>
    </section>
  </main>

  <footer class="site-footer">
    Sinh viên: Lê Tuấn Anh TUDD2024  |  MSSV: 224001709
  </footer>
</body>
</html>
